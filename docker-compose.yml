services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reklam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reklam}
      POSTGRES_DB: reklam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reklam -d reklam"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  tts:
    build: ./tts
    environment:
      TTS_ENGINE: ${TTS_ENGINE:-auto}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      TTS_THREADS: ${TTS_THREADS:-4}
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${PORT:-3012}:3012"
    environment:
      DATABASE_URL: postgres://reklam:${POSTGRES_PASSWORD:-reklam}@db:5432/reklam
      TTS_URL: http://tts:5002
      TTS_VOICE: ${TTS_VOICE:-}
    depends_on:
      db:
        condition: service_healthy
      tts:
        condition: service_started
    restart: unless-stopped

  # HTTPS для своего домена: включается профилем `https`
  # (в .env: DOMAIN=ваш-домен.ru и COMPOSE_PROFILES=https)
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
