services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reklam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reklam}
      POSTGRES_DB: reklam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reklam -d reklam"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  tts:
    build: ./tts
    environment:
      TTS_THREADS: ${TTS_THREADS:-4}
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${PORT:-3012}:3012"
    environment:
      DATABASE_URL: postgres://reklam:${POSTGRES_PASSWORD:-reklam}@db:5432/reklam
      TTS_URL: http://tts:5002
      TTS_VOICE: ${TTS_VOICE:-baya}
    depends_on:
      db:
        condition: service_healthy
      tts:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
