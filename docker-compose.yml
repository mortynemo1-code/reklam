services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reklam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reklam}
      POSTGRES_DB: reklam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reklam -d reklam"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://reklam:${POSTGRES_PASSWORD:-reklam}@db:5432/reklam
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
